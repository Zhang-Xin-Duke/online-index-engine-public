name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-env"
          "$RUNNER_TEMP/cmake-env/bin/pip" install cmake==3.31.6
          echo "$RUNNER_TEMP/cmake-env/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENGINE_BUNDLED_DEPS=ON
      - name: Build
        run: cmake --build build --parallel 2
